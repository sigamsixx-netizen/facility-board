<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설 예약 현황 (읽기전용)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', -apple-system, sans-serif; background: #f5f6fa; color: #222; }
header { background: #1a56db; color: #fff; padding: 14px 20px; }
header h1 { font-size: 18px; font-weight: 700; }
header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
#syncBadge { font-size: 11px; margin-top: 4px; font-weight: 600; }
.app-nav{background:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid #e8eaf6;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.month-nav{display:flex;align-items:center;gap:10px}
.nav-arrow{background:#f0f4ff;border:1px solid #c7d7ff;color:#1a56db;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.nav-arrow:hover{background:#1a56db;color:#fff;border-color:#1a56db}
.month-title{font-size:20px;font-weight:700;color:#1a1a1a;min-width:140px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
.legend-dot{width:13px;height:13px;border-radius:3px}
.site-view-container{padding:20px;overflow-x:auto}
.site-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px}
.site-table th,.site-table td{border:1px solid #d8dbe6;vertical-align:top}
.site-table thead th{background:#e9ebf3;color:#444;font-size:12px;font-weight:700;padding:6px 4px;text-align:center}
.site-table thead th.dow-sun{color:#dc2626}
.site-table thead th.dow-sat{color:#1d4ed8}
.site-facility-col{width:88px;background:#f3f4f8;font-size:13px;font-weight:700;color:#555;text-align:center;padding:8px 4px;white-space:pre-line}
.site-daynum-row td{background:#fafbff;font-weight:800;font-size:15px;color:#333;text-align:left;padding:5px 8px;height:36px}
.site-daynum-row td.dow-sun{color:#dc2626}
.site-daynum-row td.dow-sat{color:#1d4ed8}
.site-daynum-row td.holiday-cell{color:#dc2626}
.site-holiday-label{font-size:10px;font-weight:600;margin-left:4px}
.site-event-row td{height:auto;min-height:80px;vertical-align:middle}
.site-event-pill{display:block;font-size:14px;font-weight:600;color:#fff;padding:9px 10px;border-radius:4px;line-height:1.5;cursor:default;white-space:normal;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.site-event-pill.cont-left{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-2px}
.site-event-pill.cont-right{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-2px}
.site-week-gap td{border:none;height:8px;background:transparent}
footer{text-align:center;padding:16px;color:#999;font-size:11px}
.ro-legend-item{cursor:pointer;padding:3px 8px;border-radius:5px;transition:background .15s}
.ro-legend-item:hover{background:#f0f2f8}
.ro-legend-item.ro-active{background:#e0e7ff;font-weight:700}
.ro-legend-item.ro-dimmed{opacity:.35}
.ro-facility-filter{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0;background:#fff}
.ro-fac-btn{border:1px solid #d7dbe8;background:#fff;color:#555;font-size:12px;padding:5px 12px;
  border-radius:16px;cursor:pointer;transition:all .15s}
.ro-fac-btn:hover{background:#f0f2f8}
.ro-fac-btn.active{background:#1a56db;color:#fff;border-color:#1a56db}
/* [자동화, 2026-09-02 추가] 인쇄 시 웨이브힐/무의도/인등산 페이지가 항상 1페이지에
   들어가도록 강제. 가로(landscape) + 전체 폭 축소 + 불필요한 인터랙션 요소 숨김. */
@media print{
  @page{ size: landscape; margin: 8mm; }
  html, body{ height:100%; }
  *{ -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  body{ background:#fff; display:block; }  /* 기본은 위에서부터 흘러내리는 배치(2장 넘어가도 안전) */
  #syncBadge, .nav-arrow, .ro-facility-filter{ display:none !important; }
  header{ width:100%; text-align:center; }
  .app-nav{ position:static; box-shadow:none; justify-content:center; gap:24px; }
  footer{ display:none !important; }
  .site-view-container{ padding:0; overflow:visible; width:100%; margin:0 auto; }
  .site-table{ min-width:0 !important; width:100% !important; table-layout:fixed; margin:auto; }
  .site-table, .site-table *{ box-shadow:none !important; }
  tr, td, th{ page-break-inside:avoid; }

  /* [2026-09-02] 내용이 1장 안에 다 들어가는 경우에만(JS가 판정) 위아래 중앙정렬 +
     남는 여백만큼 확대. 1장을 넘는 경우엔 이 클래스가 안 붙어서 위 기본값(block)이 유지되어
     범례/제목이 잘리지 않고 자연스럽게 2장으로 이어짐. */
  body.print-fits{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  body.print-fits .site-view-container{ margin:auto; display:flex; flex-direction:column; justify-content:center; }

  .site-event-row td{ min-height:80px !important; }
  .site-daynum-row td{ height:36px !important; font-size:15px !important; }
  .site-event-pill{ font-size:14px !important; padding:9px 10px !important; line-height:1.5 !important; }
  .site-facility-col{ font-size:13px !important; }
}
/* [2026-10-27] 월간 보고 화면 (관리용 전용) */
.rpt-btn{background:#1a56db;color:#fff;border:0;border-radius:16px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;display:none}
.rpt-btn.on{background:#111827}
#reportView{display:none;padding:20px;background:#fff}
body.report-mode #reportView{display:block}
body.report-mode .site-view-container, body.report-mode .ro-facility-filter, body.report-mode .legend{display:none !important}
.rpt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.rpt-head h2{font-size:20px}
.rpt-head .sub{font-size:12px;color:#666;margin-top:4px}
.rpt-sign{border-collapse:collapse;font-size:12px}
.rpt-sign th,.rpt-sign td{border:1px solid #444;padding:3px 12px;text-align:center;min-width:72px}
.rpt-sign td{height:38px}
.rpt-sec{font-size:15px;font-weight:700;margin:16px 0 6px}
.rpt-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.rpt-table th,.rpt-table td{border:1px solid #bbb;padding:5px 8px;text-align:left}
.rpt-table th{background:#eef1f8;text-align:center}
.rpt-table td.c{text-align:center}
.rpt-dl{text-align:right;margin-bottom:8px}
.rpt-dl button{background:#fff;border:1px solid #1a56db;color:#1a56db;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px}
.rpt-dl button:hover{background:#1a56db;color:#fff}
.rpt-sub{font-size:13px;font-weight:700;margin:12px 0 4px;color:#333}
.rpt-cnt{font-weight:400;font-size:12px;color:#666}
.rpt-headtbl,.rpt-headtbl>tbody>tr>td{border:0 !important}
.rpt-headtbl{margin-bottom:6px}
.rpt-sign{margin-left:auto}
.rpt-total{font-size:12px;color:#444;text-align:right;margin-bottom:8px}
.rpt-note{font-size:11px;color:#666;margin-top:10px}
@media print{
  body.report-mode #reportView{padding:0}
  body.report-mode .nav-arrow, body.report-mode .rpt-btn{display:none !important}
  .rpt-table tr{page-break-inside:avoid}
  .rpt-dl{display:none !important}
  body.report-mode header, body.report-mode .app-nav, body.report-mode footer{display:none !important}
}
/* [2026-11-03] 가동율 대시보드 (관리용 전용) */
#utilView{display:none;padding:20px;background:#fff}
body.util-mode #utilView{display:block}
body.util-mode .site-view-container, body.util-mode .ro-facility-filter, body.util-mode .legend, body.util-mode #reportView, body.util-mode .month-nav{display:none !important}
#utilView h2{font-size:20px}
#utilView .sub{font-size:12px;color:#666;margin:4px 0 12px}
.ut-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px 12px;background:#f3f5fa;border-radius:8px;font-size:13px}
.ut-ctl select{font-size:13px;padding:4px 6px;border:1px solid #c5cbe0;border-radius:5px;background:#fff}
.ut-ctl .sp{flex:1}
.ut-ctl button{background:#fff;border:1px solid #1a56db;color:#1a56db;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ut-ctl button:hover{background:#1a56db;color:#fff}
.ut-sec{font-size:15px;font-weight:700;margin:16px 0 8px;color:#1B3C87}
.ut-cards{display:flex;gap:12px;flex-wrap:wrap}
.ut-card{flex:1;min-width:200px;border:1px solid #d7dbe8;border-radius:10px;padding:14px 16px;background:#fff}
.ut-card .nm{font-size:14px;font-weight:700;color:#333}
.ut-card .big{font-size:34px;font-weight:800;color:#1B3C87;margin:2px 0}
.ut-card .sm{font-size:12px;color:#666;margin-bottom:6px}
.ut-card .prev{font-size:13px;margin-top:8px;color:#444;font-weight:600}
.ut-card .prev span{font-weight:400;color:#888;font-size:11px}
.ut-bar{height:8px;background:#e8ebf3;border-radius:4px;overflow:hidden}
.ut-bar i{display:block;height:100%}
.ut-sm{font-size:11px;color:#777;font-weight:400}
.ut-frow{display:grid;grid-template-columns:130px 1fr 300px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.ut-frow .nm{font-weight:700}
.ut-frow .v{font-size:12px;color:#444}
.ut-trend{display:flex;gap:10px;align-items:flex-end;height:110px}
.ut-trend .col{flex:1;text-align:center;font-size:11px}
.ut-trend .b{height:70px;background:#eef0f6;border-radius:3px;display:flex;align-items:flex-end}
.ut-trend .b i{display:block;width:100%;border-radius:3px 3px 0 0}
.ut-trend .v{font-weight:700;margin-bottom:2px}
.ut-chartbox{border:1px solid #e3e6ee;border-radius:8px;padding:8px 10px;background:#fff}
.ut-legend{text-align:center;font-size:12px;color:#444;margin-top:2px}
.ut-lg{margin:0 10px}.ut-lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ut-insight{background:#eaf1fb;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.5;color:#1B3C87;font-weight:600}
tr.ut-future td{color:#888;background:#fafafa}
tr.ut-tot td{background:#eef1f8}
@media (max-width:700px){.ut-frow{grid-template-columns:1fr}}
@media print{
  body.util-mode #utilView{padding:0}
  body.util-mode .nav-arrow, body.util-mode .rpt-btn, .no-print{display:none !important}
  body.util-mode header, body.util-mode .app-nav, body.util-mode footer{display:none !important}
  .ut-card,.rpt-table tr{page-break-inside:avoid}
}
</style>
</head>
<body data-fixed-facility="indeung">
<header>
  <h1>🔒 시설 예약 현황 (읽기전용)</h1>

  <button class="rpt-btn" id="rptBtn" onclick="toggleReport()">📋 월간 보고</button>

  <button class="ro-fac-btn" data-fac="other" onclick="setFacilityFilter('other')">기타시설</button>
</div>
<div class="site-view-container" id="roViewContainer"></div>
<div id="reportView"></div>
<div id="utilView"></div>
<footer>매일 자동 갱신됩니다 · 최종 갱신: <span id="lastUpdated">-</span> · 화면이 오래된 것 같으면 새로고침(F5) 해주세요</footer>

function dateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function toDate(s){ return new Date(s+'T00:00:00'); }
function isVacation(r){ return r.category1==='휴양'; }
function siteCategoryColor(res){
  if (isVacation(res)) return SITE_COLORS.blocked;
  if (res.category1==='시설운영') return SITE_COLORS.blocked;
  const company = (res.company||'');

}

// 과정명 끝에 붙은 담당자 이름/직함 제거
// ⚠️ "캔미팅"/"전략팀"/"리더" 같은 과정 설명 단어를 사람 이름으로 오인식해 지우는 문제 수정
// (2026-08-21). 이 파일은 위쪽(AUTO_SYNC_JS, 관리용 보드)과 별도의 HTML/스크립트라서
// COURSE_WORD_GUARD를 여기서도 다시 정의해야 함(스코프 공유 안 됨).
const NAME_TAIL_GUARD = /^(하반기|상반기|주간회의|정기총회|전략회의|추진단|워크숍|공유회|설명회|성과공유|간담회|연수회|최종현|고문단|위원회|지원단|추진위|노사협|문화제|원장님|성과회|한마음|조직문화|인재육성|임직원|이사회|주주총회|리더십)$/;
const COURSE_WORD_GUARD = /^(캔미팅|워크샵|워크숍|전략팀|전략회의|리더십|리더|구성원|신입|영입|오리엔테이션|세션|준비|대화|임원|본부|노사|촬영|중계|포럼|코칭|출범식|해단식|캠프|행사|회의|미팅|과정|교육|팀장)$/;
function stripStaffName(text){
  if(!text) return '';
  let prev = null;
  while(prev !== text){
    prev = text;
    text = text.replace(/(^|\s)[가-힣]{2,4}\s*(RF|TL|PM|PL|PL님|매니저|담당|담당자|팀장|고문|위원|센터장|교수|전문교수|대표|부문장|실장|사업대표|씨|님)\.?$/, '$1');
    text = text.replace(/(\d+\s*명)\s+([가-힣]{2,4})$/, (m, num, name) => COURSE_WORD_GUARD.test(name) ? m : num);
    text = text.replace(/(^|\s)([가-힣]{2,4})\s+(\d+\s*명)$/, (m, pre, name, num) => COURSE_WORD_GUARD.test(name) ? m : pre + num);
  }
  // [2026-10-22] "N명" 뒤에 이어지는 담당자 이름/직함/숙소명 등은 전부 제거 (괄호 메모는 유지)
  text = text.replace(/(\d+\s*명)\s+(?!\()[^()]*?(\([^)]*\))?\s*$/, (m, num) => num);
  text = text.replace(/(\d+\s*명)\s*[가-힣]{2,4}\s*(RF|TL|PM|PL|총괄)\s*\([^)]*\)\s*$/, '$1');
  // 인원 표기 없이 끝에 붙은 사람 이름(성+이름 3글자) 제거 (예: "... W/S 1차 김리예")
  text = text.replace(/(\s)([김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구나민진지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모])([가-힣]{2})$/, (m, sp, a, b) => NAME_TAIL_GUARD.test(a+b) ? m : '');
  return text.trim();
}
// [2026-10-22] 공개용 읽기전용 보드: "[회사] 과정명 N명" 형태만 표시 (담당자·시간·숙소·메모 제외)
function publicLabel(res){
  let c = stripStaffName(res.courseName||'');
  let n = '';
  const m = c.match(/^(.*?)\s*(?:약\s*)?(\d+)\s*명/);
  if(m){ c = m[1]; n = m[2]; }
  else if(res.participants){ n = String(res.participants).replace(/[^\d]/g,''); }
  const company = res.company||'';
  if(company && c.startsWith(company)) c = c.slice(company.length);
  c = stripStaffName(c.trim()).replace(/\s+/g,' ').trim();
  let label = company ? `[${company}] ${c}` : c;
  if(n && n !== '0') label += ` ${n}명`;
  return label.trim();
}
function readonlyLabel(res){
  if(!SHOW_RETREAT) return publicLabel(res);
  // ⚠️ 비공개(SHOW_RETREAT=true) 보드에서는 담당자 이름을 지우지 않고 원문 그대로 보여줌
  // (요청: 시설별 대관 담당자 성명 전체 확인, 2026-08-25)
  let course = SHOW_RETREAT ? (res.courseName||'') : stripStaffName(res.courseName||'');
  const company = res.company||'';
  if(res.category1==='휴양' && SHOW_RETREAT){
    course = res.note || course;  // 개인휴양은 비고(담당자명)를 과정명 대신 표시
    if(res.room) course += ` · ${res.room}`;  // [2026-09-02] 숙소(콤마로 여러 개 가능)도 함께 표시
  }
  if(company && course.startsWith(company)){
    course = course.slice(company.length).trim();
  }
  let label = company ? `[${company}] ${course}` : course;
  if(res.participants && !/\d+\s*명/.test(course)) label += ` ${res.participants}명`;
  return label;
}

// [자동화] 범례 클릭 필터 / 시설 필터
function siteCategoryLabel(res){
  if ((res.category1==='휴양' && !SHOW_RETREAT) || res.category1==='시설운영') return null;
  const company = (res.company||'');
  if (company === 'mySUNI') return 'mySUNI';
  if (company === '협의회' || company === '인재위') return '인재위/협의회';
  if (company === '아카데미') return '아카데미';
  if (res.category2 === '멤버사') return '멤버사';
  return '기타';
}
let roActiveCategory = null;
let roActiveFacility = null;
function toggleCategoryFilter(cat){
  roActiveCategory = (roActiveCategory === cat) ? null : cat;
  document.querySelectorAll('.ro-legend-item').forEach(el=>{
    const isActive = el.dataset.cat === roActiveCategory;
    el.classList.toggle('ro-active', isActive);
    el.classList.toggle('ro-dimmed', roActiveCategory !== null && !isActive);
  });
  renderReadOnlyDashboard();
}
function setFacilityFilter(fac){
  roActiveFacility = fac;
  document.querySelectorAll('.ro-fac-btn').forEach(el=>{
    el.classList.toggle('active', (el.dataset.fac || null) === fac);
  });
  renderReadOnlyDashboard();
}

function changeRoMonth(delta){
  roMonth += delta;
  if(roMonth < 0){ roMonth = 11; roYear--; }
  if(roMonth > 11){ roMonth = 0; roYear++; }
  renderReadOnlyDashboard();
}

function renderReadOnlyDashboard(){
  document.getElementById('roMonthTitle').textContent = `${roYear}년 ${roMonth+1}월`;
  const container = document.getElementById('roViewContainer');
  container.innerHTML = '';

  const firstDay = new Date(roYear, roMonth, 1);
  const lastDay  = new Date(roYear, roMonth+1, 0);
  const startDow = firstDay.getDay();
  const totalDays= lastDay.getDate();
  const totalCells = Math.ceil((startDow+totalDays)/7)*7;
  const weeks = totalCells/7;

  const table = document.createElement('table');
  table.className = 'site-table';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const dowNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const corner = document.createElement('th');
  corner.textContent = '시설';
  corner.className = 'site-facility-col';
  headRow.appendChild(corner);
  dowNames.forEach((d,i)=>{
    const th = document.createElement('th');
    th.textContent = d;
    if(i===0) th.classList.add('dow-sun');
    if(i===6) th.classList.add('dow-sat');
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  for(let w=0; w<weeks; w++){
    const weekCells = [];
    for(let i=0;i<7;i++){
      const cellDate = new Date(roYear, roMonth, 1-startDow + w*7+i);
      weekCells.push(cellDate);
    }
    const weekStart = weekCells[0];
    const weekEnd = weekCells[6];
    const hasCurrMonth = weekCells.some(d=>d.getMonth()===roMonth);
    if(!hasCurrMonth) continue;

    const dateRow = document.createElement('tr');
    dateRow.className = 'site-daynum-row';
    const dateLabelCell = document.createElement('td');
    dateLabelCell.className = 'site-facility-col';
    dateRow.appendChild(dateLabelCell);
    weekCells.forEach((d,i)=>{
      const td = document.createElement('td');
      const ds = dateStr(d);
      const holiday = HOLIDAYS[ds];
      const inMonth = d.getMonth()===roMonth;
      let label = inMonth ? String(d.getDate()) : `${d.getMonth()+1}.${d.getDate()}`;
      td.textContent = label;
      if(i===0) td.classList.add('dow-sun');
      if(i===6) td.classList.add('dow-sat');
      if(holiday){
        td.classList.add('holiday-cell');
        const hl = document.createElement('span');
        hl.className = 'site-holiday-label';
        hl.textContent = holiday;
        td.appendChild(hl);
      }
      if(!inMonth) td.style.opacity = '.4';
      dateRow.appendChild(td);
    });
    tbody.appendChild(dateRow);

    SITE_FACILITY_ORDER.forEach(fac=>{
      if(roActiveFacility && fac !== roActiveFacility) return;
      const weekRes = reservations.filter(r=>{
        if(r.facility!==fac || !r.startDate || !r.endDate) return false;
        if(r.category1==='휴양' && !SHOW_RETREAT) return false;
        if(roActiveCategory && siteCategoryLabel(r) !== roActiveCategory) return false;
        const s=toDate(r.startDate), e=toDate(r.endDate);
        return s<=weekEnd && e>=weekStart;
      }).sort((a,b)=> a.startDate<b.startDate?-1:1);

      const laneLastCol = [];
      const laneAssignment = [];
      weekRes.forEach(res=>{
        const s = toDate(res.startDate), e = toDate(res.endDate);
        const colStart = Math.max(0, Math.round((s - weekStart)/86400000));
        const colEnd = Math.min(6, Math.round((e - weekStart)/86400000));
        let lane = laneLastCol.findIndex(lastCol => colStart > lastCol);
        if(lane === -1){ lane = laneLastCol.length; laneLastCol.push(colEnd); }
        else { laneLastCol[lane] = colEnd; }
        laneAssignment.push({res, lane, colStart, colEnd});
      });
      const nLanes = Math.max(1, laneLastCol.length);

      for(let lane=0; lane<nLanes; lane++){
        const facRow = document.createElement('tr');
        facRow.className = 'site-event-row';
        if(lane===0){
          const facLabelCell = document.createElement('td');
          facLabelCell.className = 'site-facility-col';
          facLabelCell.textContent = SITE_FACILITY_LABEL[fac];
          facLabelCell.rowSpan = nLanes;
          facRow.appendChild(facLabelCell);
        }
        // [자동화] 여러 도형을 이어붙이는 대신, 진짜 하나로 병합된 셀(colspan)로 그림
        let col = 0;
        while(col < 7){
          const entry = laneAssignment.find(a=>a.lane===lane && a.colStart===col);
          if(entry){
            const span = entry.colEnd - entry.colStart + 1;
            const td = document.createElement('td');
            td.colSpan = span;
            const res = entry.res;
            const resStart = toDate(res.startDate), resEnd = toDate(res.endDate);
            const pill = document.createElement('div');
            pill.className = 'site-event-pill';
            pill.style.background = siteCategoryColor(res);
            let label = readonlyLabel(res);
            if(resStart < weekStart) label = '« ' + label;
            if(resEnd > weekEnd) label = label + ' »';
            pill.textContent = label;
            pill.title = `${label} | ${res.startDate}~${res.endDate}`;
            td.appendChild(pill);
            facRow.appendChild(td);
            col += span;
          } else {
            facRow.appendChild(document.createElement('td'));
            col += 1;
          }
        }
        tbody.appendChild(facRow);
      }
    });

    if(w < weeks-1){
      const gapRow = document.createElement('tr');
      gapRow.className = 'site-week-gap';
      for(let i=0;i<8;i++) gapRow.appendChild(document.createElement('td'));
      tbody.appendChild(gapRow);
    }
  }

  table.appendChild(tbody);
  container.appendChild(table);
  if(typeof renderReport==='function') renderReport();
  if(typeof renderUtil==='function') renderUtil();
}


// ===== [2026-10-27] 월간 보고 (관리용 전용) =====
// 교육·대관: 회사 / 과정명 / 인원      개인휴양: 회사 / 사용자 / 사용 숙소 / 인원
function splitCourse(res){
  let c = stripStaffName(res.courseName||'');
  let n = '';
  const m = c.match(/^(.*?)\s*(?:약\s*)?(\d+)\s*명/);
  if(m){ c = m[1]; n = m[2]; }
  else if(res.participants){ n = String(res.participants).replace(/[^\d]/g,''); }
  const company = res.company||'';
  if(company && c.startsWith(company)) c = c.slice(company.length);
  c = stripStaffName(c.trim()).replace(/\s+/g,' ').trim();
  return {company, course:c, n:(n && n!=='0') ? n : ''};
}
function retreatParts(res){
  const user = (res.note || res.courseName || '').replace(/\s+/g,' ').trim();
  const n = res.participants ? String(res.participants).replace(/[^\d]/g,'') : '';
  let company = res.company||'', who = user;
  // [2026-10-27] 회사 칸이 비어 있으면 사용자 표기에서 소속을 보완 (엑셀 회사 칸을 채우면 그 값이 우선)
  if(!company){
    if(/^원장님?$/.test(user)) company = '아카데미';
    else { const mm = user.match(/^(주식회사|CD)\s+(.+)$/); if(mm){ company = mm[1]; who = mm[2]; } }
  }
  return {company, user: who, room: res.room||'', n:(n && n!=='0') ? n : ''};
}
function escHtml(t){ return String(t==null?'':t).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function fmtMD(s){ const d = toDate(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function toggleReport(){
  document.body.classList.remove('util-mode');
  const ub = document.getElementById('utilBtn'); if(ub){ ub.classList.remove('on'); ub.textContent='📊 가동율·통계'; }
  document.body.classList.toggle('report-mode');
  const on = document.body.classList.contains('report-mode');
  const b = document.getElementById('rptBtn');
  if(b){ b.classList.toggle('on', on); b.textContent = on ? '📅 예약현황으로' : '📋 월간 보고'; }
  renderReport();
}
function reportKind(r){
  if(r.category1==='휴양') return '개인휴양';
  const c = r.company||'';
  return (c==='아카데미'||c==='mySUNI'||c==='인재위'||c==='협의회') ? '교육' : '대관';
}
function renderReport(){
  const btn = document.getElementById('rptBtn');
  if(btn && SHOW_RETREAT) btn.style.display = 'inline-block';
  const box = document.getElementById('reportView');
  if(!box || !SHOW_RETREAT || !document.body.classList.contains('report-mode')) return;
  const first = new Date(roYear, roMonth, 1), last = new Date(roYear, roMonth+1, 0);
  const rows = reservations.filter(r=>{
    if(!r.startDate || !r.endDate || r.category1==='시설운영') return false;
    if(roActiveFacility && r.facility !== roActiveFacility) return false;
    return toDate(r.startDate) <= last && toDate(r.endDate) >= first;
  });
  const kindOrder = {'교육':0,'대관':1,'개인휴양':2};
  rows.sort((a,b)=> kindOrder[reportKind(a)]-kindOrder[reportKind(b)] || (a.startDate<b.startDate?-1:a.startDate>b.startDate?1:0));
  const facName = f => (SITE_FACILITY_LABEL[f]||f||'').replace(/\n/g,'');
  const facs = ['muui','indeung','wavehill'];
  rows.forEach(r=>{ if(!facs.includes(r.facility)) facs.push(r.facility); });
  let totalEdu = 0, totalVac = 0, secHtml = '';
  facs.forEach(f=>{
    if(roActiveFacility && roActiveFacility!==f) return;
    const list = rows.filter(r=>r.facility===f);

    }).join('') || '<tr><td colspan="8" class="c">해당 없음</td></tr>';
    secHtml += `<div class="rpt-sub">▪ ${escHtml(facName(f))} <span class="rpt-cnt">(교육·대관 ${nEdu}건 / 개인휴양 ${nVac}건)</span></div>
      <table class="rpt-table"><colgroup><col style="width:5%"><col style="width:9%"><col style="width:13%"><col style="width:14%"><col style="width:26%"><col style="width:13%"><col style="width:7%"><col style="width:13%"></colgroup>
      <thead><tr><th>No</th><th>구분</th><th>기간</th><th>회사</th><th>과정명 / 사용자</th><th>사용 숙소</th><th>인원</th><th>비고</th></tr></thead><tbody>${body}</tbody></table>`;
  });
  const scope = roActiveFacility ? facName(roActiveFacility) : '전체 시설';
  box.innerHTML = `
    <div class="rpt-dl"><button onclick="downloadReport('xls')">⬇ 엑셀로 받기</button><button onclick="downloadReport('doc')">⬇ 워드로 받기</button></div>
    <div id="rptDoc">
    <table class="rpt-headtbl" width="100%"><tr>
      <td style="border:0;text-align:left;vertical-align:top"><h2>${roYear}년 ${roMonth+1}월 시설 이용 현황 보고</h2>
        <div class="sub">${escHtml(scope)} · 기준일 ${dateStr(new Date())} · 작성 시설담당 황병식 · 교육·대관 ${totalEdu}건 / 개인휴양 ${totalVac}건</div></td>
      <td style="border:0;text-align:right;vertical-align:top" align="right"><table class="rpt-sign" align="right"><tr><th>작성</th><th>담당RF</th><th>팀장 승인</th></tr><tr><td>황병식</td><td></td><td></td></tr></table></td>
    </tr></table>
    ${secHtml}
    <div class="rpt-note">※ 월 걸침 건은 해당 월에 일부라도 포함되면 표시됩니다. 구분: 아카데미·mySUNI·인재위/협의회=교육, 그 외 회사=대관. 경비실 출입대장 대조 결과는 비고란에 기록합니다.</div></div>`;
}

// [2026-10-28] 월간 보고 다운로드 (엑셀/워드 — 열어서 수정 가능). 외부 라이브러리 없이 HTML 표 형식으로 저장
function downloadReport(kind){
  const src = document.getElementById('rptDoc');
  if(!src) return;
  const doc = src.cloneNode(true);
  // 워드/엑셀에서 표 선이 보이도록 속성으로도 지정
  doc.querySelectorAll('table.rpt-table, table.rpt-sign').forEach(t=>{ t.setAttribute('border','1'); t.setAttribute('cellspacing','0'); t.setAttribute('cellpadding','4'); });
  doc.querySelectorAll('table.rpt-table').forEach(t=>{ t.setAttribute('width','100%'); });
  doc.querySelectorAll('table.rpt-headtbl').forEach(t=>{ t.setAttribute('border','0'); });
  const css = 'body{font-family:"맑은 고딕",sans-serif;font-size:11pt} h2{font-size:16pt} .sub,.rpt-note{font-size:9pt;color:#555} .rpt-sec{font-size:12pt;font-weight:bold;margin-top:14px} .rpt-sub{font-weight:bold;margin-top:8px} table{border-collapse:collapse} th,td{border:1px solid #666;padding:4px 8px} th{background:#eef1f8} td.c{text-align:center} .rpt-sign td{height:40px}';
  const ns = kind==='xls'
    ? 'xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"'
    : 'xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"';
  const html = '<html '+ns+'><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+doc.innerHTML+'</body></html>';
  const mime = kind==='xls' ? 'application/vnd.ms-excel' : 'application/msword';
  const blob = new Blob(['\ufeff'+html], {type: mime+';charset=utf-8'});
  const a = document.createElement('a');
  const scope = roActiveFacility ? '_'+(SITE_FACILITY_LABEL[roActiveFacility]||roActiveFacility).replace(/\n/g,'') : '';
  a.href = URL.createObjectURL(blob);
  a.download = `시설이용현황_${roYear}-${String(roMonth+1).padStart(2,'0')}${scope}.${kind}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

// ===== [2026-11-03] 가동율 대시보드 (관리용 전용) — 데이터(reservations)가 바뀌면 자동 재계산 =====
// 산정 기준 = 기존 정리파일(종합 시트) 기준: 가동율 = 사용일수(중복 제외) ÷ 근무일수(평일-공휴일)
//  WAVEHILL: 교육만 / 무의·인등산: 교육+개인휴양(평일·주말), 같은 날 겹치면 1일 / 무의도 2022는 5~12월 기준
const UT_FACS = [['wavehill','WAVEHILL','WAVEHILL'],['muui','무의도','무의연수원'],['indeung','인등산','인등산 SUPEX센터']];
const UT_START = {'muui|2022':5};
// 2022~2025 연간은 정리파일 보고치(사용일, 근무일) — 기준은 연도별로 달랐고 과거 보고치이므로 고정
const UT_HIST = {
  wavehill:{2022:[133,247],2023:[148,247],2024:[73,246],2025:[79,244]},
  muui:{2022:[94,167],2023:[169,247],2024:[175,246],2025:[187,244]},
  indeung:{2022:[103,247],2023:[196,247],2024:[183,246],2025:[211,244]}};
const UT_FMTS = [
  ['report','⓪ 종합 보고 (최초 양식) — 실시간'],
  ['summary','① 가동율 + 교육인원 카드형'],
  ['forecast','② 현재 기준 + 연말 예상 (신규 양식)'],
  ['detail','③ 가동율 산정 내역표'],
  ['monthly','④ 월별 가동율표 (정리파일 종합시트 형태)'],
  ['trend','⑤ 연도별 추이 (2022~)'],
  ['basis','⑥ 가동율 산정 기준표'],
  ['facility','⑦ 시설별 사용 현황'],
  ['cat1','⑧ 대분류별 현황'],
  ['cat2','⑨ 중분류별 현황'],
  ['eduType','⑩ 교육 형태별 현황'],
  ['company','⑪ 회사별 현황 (멤버사별 사용 횟수)'],
  ['people','⑫ 월별 연인원·교육인원 추이'],
  ['yearcmp','⑬ 연도별 종합 비교']
];
let utState = {year:null, cm:null, fac:'', fmt:'report'};
let _utCache = {src:null, n:-1, sets:null, ppl:null};

function utIsWd(key){
  const dow = new Date(key+'T00:00:00Z').getUTCDay();
  return dow>0 && dow<6 && !HOLIDAYS[key];
}
function utExpand(s,e,set){
  let t = Date.parse(s+'T00:00:00Z'); const t1 = Math.max(t, Date.parse(e+'T00:00:00Z'));
  for(; t<=t1; t+=86400000) set.add(new Date(t).toISOString().slice(0,10));
}
function utData(){
  if(_utCache.src===reservations && _utCache.n===reservations.length) return _utCache;
  const sets = {}, ppl = {};
  UT_FACS.forEach(f=>{ sets[f[0]] = {edu:new Set(), ret:new Set()}; ppl[f[0]] = []; });
  (reservations||[]).forEach(r=>{
    const S = sets[r.facility]; if(!S || !r.startDate) return;
    const end = r.endDate || r.startDate;
    if(r.category1==='교육'){
      utExpand(r.startDate, end, S.edu);
      ppl[r.facility].push({y:+r.startDate.slice(0,4), m:+r.startDate.slice(5,7), p:+r.participants||0});
    } else if(r.category1==='휴양' && r.facility!=='wavehill'){
      utExpand(r.startDate, end, S.ret);
    }
  });
  _utCache = {src:reservations, n:reservations.length, sets, ppl};
  return _utCache;
}
function utWorkdays(y,m1,m2){
  let n=0;
  for(let m=m1;m<=m2;m++){
    const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
    for(let d=1; d<=dim; d++){
      const k = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(utIsWd(k)) n++;
    }
  }
  return n;
}
function utCalc(fk,y,m1,m2){
  m1 = Math.max(m1, UT_START[fk+'|'+y]||1);
  const D = utData(), S = D.sets[fk];
  const pick = set => [...set].filter(k=>{ if(+k.slice(0,4)!==y) return false; const m=+k.slice(5,7); return m>=m1 && m<=m2; });
  const E = pick(S.edu), R = pick(S.ret), Eset = new Set(E);
  const ew = E.filter(utIsWd).length;
  const ro = R.filter(k=>utIsWd(k) && !Eset.has(k)).length;
  const wke = E.filter(k=>!utIsWd(k)).length;
  const wkr = R.filter(k=>!utIsWd(k) && !Eset.has(k)).length;
  const used = new Set([...E, ...R]).size;
  const wd = m1<=m2 ? utWorkdays(y,m1,m2) : 0;
  const pr = D.ppl[fk].filter(x=>x.y===y && x.m>=m1 && x.m<=m2);
  return {wd, ew, ro, wke, wkr, used, p: wd? used/wd*100 : 0, n: pr.length, people: pr.reduce((a,x)=>a+x.p,0)};
}
function utRate(fk,y,m1,m2){
  const h = (UT_HIST[fk]||{})[y];
  if(h && m1<=(UT_START[fk+'|'+y]||1) && m2>=12) return {used:h[0], wd:h[1], p:h[0]/h[1]*100};
  return null;
}
function utCalcR(fk,y,m1,m2){ const c = utCalc(fk,y,m1,m2), r = utRate(fk,y,m1,m2); return r ? Object.assign(c,r) : c; }
function utForecast(fk,year,cm){
  const ytd = utCalc(fk,year,1,cm);
  const full = utWorkdays(year, UT_START[fk+'|'+year]||1, 12);
  const rest = cm<12 ? utCalc(fk,year,cm+1,12) : {used:0,ew:0,ro:0,wke:0,wkr:0};
  const prevRest = cm<12 ? utCalc(fk,year-1,cm+1,12).used : 0;
  const pct = u => full? u/full*100 : 0;
  return {full, restWd: full-ytd.wd, ytd, rest, prevRest,
          A:{used:ytd.used+rest.used, p:pct(ytd.used+rest.used)},
          B:{used:ytd.used+prevRest, p:pct(ytd.used+prevRest)},
          C:{used:Math.round(ytd.p/100*full), p:ytd.p}};
}
const utF1 = x => x.toFixed(1)+'%';
const utN = x => Number(x).toLocaleString('ko-KR');
function utFacList(){
  const f = FIXED_FACILITY || utState.fac;
  return UT_FACS.filter(x=>!f || x[0]===f);
}
function utYears(){
  const D = utData(); let min=9999, max=0;
  UT_FACS.forEach(f=>{ [D.sets[f[0]].edu, D.sets[f[0]].ret].forEach(s=>s.forEach(k=>{ const y=+k.slice(0,4); if(y<min)min=y; if(y>max)max=y; })); });
  if(min===9999){ min=max=new Date().getFullYear(); }
  return [min,max];
}
function utInit(){
  if(utState.year!==null) return;
  const now = new Date(); let y = now.getFullYear(), m = now.getMonth(); // m = 전월(1~12)
  if(m===0){ y--; m=12; }
  const [mn,mx] = utYears();
  if(y>mx) y=mx; if(y<mn) y=mn;
  utState.year=y; utState.cm=m;
}
function toggleUtil(){
  document.body.classList.remove('report-mode');
  const rb = document.getElementById('rptBtn'); if(rb){ rb.classList.remove('on'); rb.textContent='📋 월간 보고'; }
  document.body.classList.toggle('util-mode');
  const on = document.body.classList.contains('util-mode');
  const b = document.getElementById('utilBtn');
  if(b){ b.classList.toggle('on', on); b.textContent = on ? '📅 예약현황으로' : '📊 가동율·통계'; }
  renderUtil();
}
function utSet(k,v){ utState[k] = (k==='year'||k==='cm') ? +v : v; renderUtil(); }
function utBar(p, color){ return `<div class="ut-bar"><i style="width:${Math.min(100,Math.max(0,p))}%;background:${color||'#1a56db'}"></i></div>`; }
const UT_COLOR = {wavehill:'#EF9F27', muui:'#378ADD', indeung:'#1D9E75'};  // 시설 고유색: 강뷰=주황 / 바다뷰=파랑 / 마운틴뷰=초록

function utFmtSummary(y,cm){
  const L = utFacList();
  const cards = L.map(f=>{
    const c = utCalcR(f[0],y,1,cm), p = utCalcR(f[0],y-1,1,12);
    return `<div class="ut-card"><div class="nm">${f[2]}</div><div class="big">${utF1(c.p)}</div>
      <div class="sm">${y}년 1~${cm}월 · 사용 ${c.used}일 / 근무일 ${c.wd}일</div>${utBar(c.p, UT_COLOR[f[0]])}
      <div class="prev">${y-1}년 연간 ${utF1(p.p)} <span>(사용 ${p.used}일 / ${p.wd}일)</span></div></div>`;
  }).join('');
  const rows = L.map(f=>{
    const c = utCalcR(f[0],y,1,cm), p = utCalcR(f[0],y-1,1,12);
    return `<tr><td>${f[2]}</td><td class="c">${utN(c.people)}명</td><td class="c">${c.n}건</td><td class="c">${utN(p.people)}명</td><td class="c">${p.n}건</td></tr>`;
  }).join('');
  const tot = L.reduce((a,f)=>{ const c=utCalcR(f[0],y,1,cm), p=utCalcR(f[0],y-1,1,12); a[0]+=c.people; a[1]+=c.n; a[2]+=p.people; a[3]+=p.n; return a; },[0,0,0,0]);
  return `<div class="ut-sec">시설 가동율 (${y}년 1~${cm}월 현재 · ${y-1}년 연간 비교)</div><div class="ut-cards">${cards}</div>
    <div class="ut-sec">교육 인원</div>
    <table class="rpt-table"><thead><tr><th>시설</th><th>${y}년 1~${cm}월 인원</th><th>교육 건수</th><th>${y-1}년 연간 인원</th><th>교육 건수</th></tr></thead><tbody>${rows}
    <tr><td><b>합계</b></td><td class="c"><b>${utN(tot[0])}명</b></td><td class="c">${tot[1]}건</td><td class="c"><b>${utN(tot[2])}명</b></td><td class="c">${tot[3]}건</td></tr></tbody></table>
    <div class="rpt-note">※ 가동율 = 사용일수(교육+개인휴양, 중복 제외) ÷ 근무일수(평일-공휴일). WAVEHILL은 교육만. 주말·공휴일 사용은 분자에만 포함.</div>`;
}
function utFmtForecast(y,cm){
  const L = utFacList();

function utAgg(recs, keyFn){
  const M = new Map();

    o.n++; o.days += (+r.days||1); if(r.category1==='교육'){ o.ppl += (+r.participants||0); o.tot += (+r.totalParticipants||0); }

}

  </tbody></table><div class="rpt-note">※ 연도별 가동율은 정리파일 기준(사용일수 ÷ 근무일). 건수·사용일수·인원은 예약 시작일 기준 집계입니다.</div>`;
}
// ===== [2026-11-03] 종합 보고 (최초 양식) — 실시간 =====
const UT_REP_COLOR = UT_COLOR;
function utTopCompanies(n){
  const keys = UT_FACS.map(f=>f[0]); const tot = {}, per = {};
  (reservations||[]).forEach(r=>{
    if(r.category1!=='교육' || !keys.includes(r.facility) || !r.company) return;
    const d = +r.days||1; tot[r.company]=(tot[r.company]||0)+d;
    (per[r.company]=per[r.company]||{})[r.facility]=((per[r.company]||{})[r.facility]||0)+d;
  });
  const names = Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).slice(0,n);
  return {names, per, tot};
}
function utSvgAxis(W,H,pad,max,steps){
  let s=''; for(let i=0;i<=steps;i++){ const v=max*i/steps, y=H-pad.b-(H-pad.t-pad.b)*i/steps;
    s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="#e3e6ee"/><text x="${pad.l-5}" y="${y+3}" font-size="9" fill="#888" text-anchor="end">${Math.round(v)}</text>`; }
  return s;
}
function utSvgLine(cats, series, max){
  const W=660,H=190,pad={l:34,r:12,t:12,b:26}, n=cats.length, gx=i=>pad.l+(W-pad.l-pad.r)*(i+.5)/n, gy=v=>H-pad.b-(H-pad.t-pad.b)*v/max;
  let s=utSvgAxis(W,H,pad,max,5);
  cats.forEach((c,i)=>{ s+=`<text x="${gx(i)}" y="${H-8}" font-size="10" fill="#555" text-anchor="middle">${c}</text>`; });
  series.forEach(se=>{
    s+=`<polyline fill="none" stroke="${se.color}" stroke-width="2.5" points="${se.vals.map((v,i)=>gx(i)+','+gy(v)).join(' ')}"/>`;
    se.vals.forEach((v,i)=>{
      const all = series.map(o=>o.vals[i]); let dx=0, dy=-8, anc='middle';
      if(v>=Math.max(...all)){ dy=-8; } else if(v<=Math.min(...all)){ dy=16; } else { dx = (i===n-1)? -10 : 10; dy=4; anc = (i===n-1)? 'end' : 'start'; }
      s+=`<circle cx="${gx(i)}" cy="${gy(v)}" r="4" fill="${se.color}"/><text x="${gx(i)+dx}" y="${gy(v)+dy}" font-size="9.5" font-weight="700" fill="${se.color}" text-anchor="${anc}">${v.toFixed(0)}%</text>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function utSvgStack(cats, series, max){
  const W=660,H=190,pad={l:34,r:12,t:12,b:26}, n=cats.length, bw=(W-pad.l-pad.r)/n*0.5, gy=v=>(H-pad.t-pad.b)*v/max;
  let s=utSvgAxis(W,H,pad,max,4);
  cats.forEach((c,i)=>{ const x=pad.l+(W-pad.l-pad.r)*(i+.5)/n; s+=`<text x="${x}" y="${H-8}" font-size="10" fill="#555" text-anchor="middle">${c}</text>`;
    let acc=0; series.forEach(se=>{ const v=se.vals[i], h=gy(v), y=H-pad.b-gy(acc)-h; acc+=v;
      s+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${h}" fill="${se.color}"/>`+(h>11?`<text x="${x}" y="${y+h/2+3}" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">${v}</text>`:''); }); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function utSvgCluster(cats, series, max){
  const W=660,H=190,pad={l:34,r:12,t:16,b:26}, n=cats.length, k=series.length, gw=(W-pad.l-pad.r)/n, bw=gw*0.7/k, gy=v=>(H-pad.t-pad.b)*v/max;
  let s=utSvgAxis(W,H,pad,max,4);
  cats.forEach((c,i)=>{ const x0=pad.l+gw*i+gw*0.15; s+=`<text x="${pad.l+gw*(i+.5)}" y="${H-8}" font-size="10" fill="#555" text-anchor="middle">${c}</text>`;
    series.forEach((se,j)=>{ const v=se.vals[i], h=gy(v), x=x0+bw*j; s+=`<rect x="${x}" y="${H-pad.b-h}" width="${bw-1}" height="${h}" fill="${se.color}"/><text x="${x+bw/2}" y="${H-pad.b-h-3}" font-size="8.5" font-weight="700" fill="#333" text-anchor="middle">${v}</text>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function utFmtReport(y,cm){
  const L = UT_FACS; const [mn] = utYears(); const ys=[]; for(let k=mn;k<=y;k++) ys.push(k);
  const lab = ys.map(k=>k===y?`${k}(~${cm}월)`:String(k));
  const cur = {}, prv = {};
  L.forEach(f=>{ cur[f[0]]=utCalcR(f[0],y,1,cm); prv[f[0]]=utCalcR(f[0],y-1,1,12); });
  const cards = L.map(f=>{ const c=cur[f[0]], d=c.p-prv[f[0]].p;
    return `<div class="ut-card" style="border-top:4px solid ${UT_REP_COLOR[f[0]]}"><div class="nm">${f[1]} · ${y} 가동율</div><div class="big" style="color:${UT_REP_COLOR[f[0]]}">${utF1(c.p)}</div>
      <div class="prev" style="color:${d>=0?'#1D9E75':'#E24B4A'}">${y-1} 연간 ${utF1(prv[f[0]].p)} 대비 ${d>=0?'+':''}${d.toFixed(1)}%p</div></div>`; }).join('');
  const rates = L.map(f=>({n:f[2],p:cur[f[0]].p, up:cur[f[0]].p>=prv[f[0]].p}));
  const best = rates.reduce((a,b)=>b.p>a.p?b:a), worst = rates.reduce((a,b)=>b.p<a.p?b:a);
  const T = utTopCompanies(6); const tot = T.names.map(n=>T.tot[n]); const share = tot.length? tot.slice(0,3).reduce((a,b)=>a+b,0)/tot.reduce((a,b)=>a+b,0)*100 : 0;
  const upAll = rates.every(r=>r.up);
  const ins = `시사점  ${best.n} ${utF1(best.p)}로 가장 높고 ${worst.n} ${utF1(worst.p)}로 가장 낮음. ${upAll?`3개 시설 모두 ${y-1}년 연간 대비 상승.`:`${y-1}년 연간 대비 상승: ${rates.filter(r=>r.up).map(r=>r.n).join(', ')||'없음'}.`} 교육 누계 사용일은 ${T.names.slice(0,3).join('·')} 3개사가 상위 6개사의 ${share.toFixed(0)}%를 차지.`;
  const rateS = L.map(f=>({color:UT_REP_COLOR[f[0]], name:f[1], vals:ys.map(k=>utCalcR(f[0],k,1,k===y?cm:12).p)}));
  const usedS = L.map(f=>({color:UT_REP_COLOR[f[0]], name:f[1], vals:ys.map(k=>utCalcR(f[0],k,1,k===y?cm:12).used)}));
  const compS = L.map(f=>({color:UT_REP_COLOR[f[0]], name:f[1], vals:T.names.map(n=>(T.per[n]||{})[f[0]]||0)}));
  const legend = L.map(f=>`<span class="ut-lg"><i style="background:${UT_REP_COLOR[f[0]]}"></i>${f[1]}</span>`).join('');
  const maxStack = Math.max(50, ...ys.map((k,i)=>usedS.reduce((a,s)=>a+s.vals[i],0)));
  const maxComp = Math.max(10, ...compS.flatMap(s=>s.vals));
  return `<div class="ut-cards">${cards}</div>
  <div class="ut-sec">연도별 시설 가동율 추이 (%)</div><div class="ut-chartbox">${utSvgLine(lab,rateS,100)}<div class="ut-legend">${legend}</div></div>
  <div class="ut-sec">연도별 시설 사용일수 (일, 시설별 구분)</div><div class="ut-chartbox">${utSvgStack(lab,usedS,Math.ceil(maxStack/100)*100)}<div class="ut-legend">${legend}</div></div>
  <div class="ut-sec">주요 멤버사별 사용일수 (누계, 상위 6개사)</div><div class="ut-chartbox">${utSvgCluster(T.names,compS,Math.ceil(maxComp/100)*100)}<div class="ut-legend">${legend}</div></div>
  <div class="ut-insight">${escHtml(ins)}</div>
  <div class="rpt-note">※ 가동율=사용일수(중복 제외)÷근무일수. ${mn}~${y-1}년은 정리파일 연간 보고치, ${y}년은 ${cm}월까지 자동 산정. 데이터가 갱신되면 이 화면도 자동으로 바뀝니다.</div>`;
}

  const scope = FIXED_FACILITY ? (UT_FACS.find(f=>f[0]===FIXED_FACILITY)||[])[2] : (utState.fac ? (UT_FACS.find(f=>f[0]===utState.fac)||[])[2] : '전체 시설');
  box.innerHTML = `

      <label>기준월 <select onchange="utSet('cm',this.value)">${mOpt.join('')}</select></label>
      ${FIXED_FACILITY?'':`<label>시설 <select onchange="utSet('fac',this.value)">${fOpt}</select></label>`}
      <span class="sp"></span>
      <button onclick="downloadUtil('xls')">⬇ 엑셀로 받기</button><button onclick="window.print()">🖨 인쇄</button>
    </div>
    <div id="utilDoc">
      <h2>${y}년 ${titles[utState.fmt]}</h2>
      <div class="sub">${escHtml(scope)} · 기준 ${y}년 ${cm}월말 · 조회일 ${dateStr(new Date())} · 작성 시설담당 황병식 · 예약 데이터 변경 시 자동 재계산</div>
      ${fn(y,cm)}

}
function downloadUtil(kind){
  const src = document.getElementById('utilDoc'); if(!src) return;
  const doc = src.cloneNode(true);
  doc.querySelectorAll('table.rpt-table').forEach(t=>{ t.setAttribute('border','1'); t.setAttribute('cellspacing','0'); t.setAttribute('cellpadding','4'); t.setAttribute('width','100%'); });
  doc.querySelectorAll('.ut-bar,.ut-trend').forEach(e=>e.remove());
  const css = 'body{font-family:"맑은 고딕",sans-serif;font-size:11pt} h2{font-size:16pt} .sub,.rpt-note,.ut-sm{font-size:9pt;color:#555} .ut-sec{font-size:12pt;font-weight:bold;margin-top:14px} table{border-collapse:collapse} th,td{border:1px solid #666;padding:4px 8px} th{background:#eef1f8} td.c{text-align:center} .ut-card{border:1px solid #999;padding:6px;display:inline-block;width:30%}.big{font-size:18pt;font-weight:bold}';
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+doc.innerHTML+'</body></html>';
  const blob = new Blob(['﻿'+html], {type:'application/vnd.ms-excel;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `가동율_${utState.fmt}_${utState.year}-${String(utState.cm).padStart(2,'0')}.${kind}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

async function pollForUpdates(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('no data.json');
    const json = await res.json();
    document.getElementById('syncBadge').textContent = '🟢 자동 갱신 중 · 마지막 ' + (json.updatedAt||'-');
    document.getElementById('lastUpdated').textContent = json.updatedAt||'-';
    if(json.version !== DATA_VERSION){
      DATA_VERSION = json.version;
      reservations = json.records;
      renderReadOnlyDashboard();
    }
  }catch(e){
    document.getElementById('syncBadge').textContent = '⚪ 자동 갱신 연결 안 됨';
  }
}

setInterval(pollForUpdates, 10000);

  if (FIXED_FACILITY) {
    // ⚠️ 시설별 전용 페이지: 필터바를 숨기고 그 시설로 고정, 제목도 바꿔줌
    roActiveFacility = FIXED_FACILITY;

    if (filterBar) filterBar.style.display = 'none';
    const label = (SITE_FACILITY_LABEL[FIXED_FACILITY] || FIXED_FACILITY).replace(/\n/g, '');

});

// [2026-09-14 수정] 읽기전용/관리용(전체 시설)처럼 내용이 아주 긴 경우에도 반드시 1장 안에
// 들어가도록 축소 폭 제한(0.3)을 없앰. 반대로 웨이브힐/무의도/인등산처럼 내용이 짧아 여백이
// 남는 경우엔 페이지를 꽉 채우도록 확대(최대 2.2배)하는 기능을 추가.
function fitPrintLayout(){
  const container = document.querySelector('.site-view-container');
  if (!container) return;
  container.style.zoom = '';
  document.body.classList.remove('print-fits');

  const headerH = (document.querySelector('header')?.offsetHeight || 0);
  const navH = (document.querySelector('.app-nav')?.offsetHeight || 0);
  // A4 가로(297×210mm) 기준, 여백 8mm×2 뺀 실제 인쇄 가능 높이 ≈ 733px(96dpi 환산).
  // 브라우저마다 계산이 조금씩 달라 오차가 있을 수 있어 8% 안전 여유를 더 뺌.
  const pageHeightPx = Math.round((733 - headerH - navH - 16) * 0.92);
  const contentHeight = container.scrollHeight;

  if (contentHeight > 0 && pageHeightPx > 0) {
    let scale = pageHeightPx / contentHeight;
    if (scale > 1) scale = Math.min(scale, 2.2);  // 내용이 짧을 땐 확대해서 1장을 꽉 채움(과확대 방지 상한)
    container.style.zoom = scale;
  }
  document.body.classList.add('print-fits');  // 축소했든 확대했든, 이제 1장 안에 들어가므로 중앙정렬
}
function fitReportPrint(){
  const d = document.getElementById('rptDoc');
  if(!d) return;
  d.style.zoom = '';
  const avail = 733 * 0.94;   // A4 가로, 여백 제외 인쇄 가능 높이(px)
  const h = d.scrollHeight;
  if(h > avail) d.style.zoom = avail / h;
}
window.addEventListener('beforeprint', ()=>{ if(document.body.classList.contains('util-mode')) return; if(document.body.classList.contains('report-mode')) fitReportPrint(); else fitPrintLayout(); });
window.addEventListener('afterprint', ()=>{
  const rd = document.getElementById('rptDoc'); if(rd) rd.style.zoom = '';
  const container = document.querySelector('.site-view-container');
  if (container){ container.style.zoom = ''; }
  document.body.classList.remove('print-fits');
});
</script>
